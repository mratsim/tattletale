[project]
name = "tattletale"
version = "0.1.0"
description = "An AI inference framework"
requires-python = "==3.14.*"

# Create the venv with
#   python -m venv --copies .venv
# Then
#   uv sync --group test-vectors
#
# This ensures the .venv copies Python instead of symlinking it.
# This allows passing the tattletale repo in a container sandbox to agent harnesses.

# For now Python is mostly used to generate test vectors.
[dependency-groups]
test-vectors = [
    "torch==2.11.0",
    "safetensors>=0.7.0",
    "transformers>=5.2.0",
    "tokenizers>=0.20.0",
    "tiktoken>=0.12.0",
    "tokendagger == 0.1.1",
    "flash_attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu130torch2.11-cp314-cp314-linux_x86_64.whl"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130"}]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["t_*.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]