[project]
name = "tattletale"
version = "0.1.0"
description = "An AI inference framework"
requires-python = "==3.14.*"

# Create the venv with
#   python -m venv --copies .venv
# Then
#   uv sync --group test-vectors
#
# This ensures the .venv copies Python instead of symlinking it.
# This allows passing the tattletale repo in a container sandbox to agent harnesses.

# For now Python is mostly used to generate test vectors.
[dependency-groups]
test-vectors = [
    "torch==2.14.0",
    "safetensors>=0.7.0",
    "transformers==5.16.1",
    "tokenizers>=0.20.0",
    "tiktoken>=0.12.0",
    "einops>=0.8.0; sys_platform == 'darwin'",
]

bench = [
    "tokendagger == 0.1.1"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["t_*.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]